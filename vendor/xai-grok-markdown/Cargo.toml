[package]
name = "xai-grok-markdown"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["xAI"]
publish = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[dependencies]
anstyle = "1.0"
anstyle-lossy = "1.1.4"
anstyle-syntect = "1.0.4"
html-escape = "0.2"
linkify = "0.10"
pulldown-cmark = "0.13"
ratatui = { version = "0.30", default-features = false, features = ["std"] }
supports-color = "3.0"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
textwrap = "0.16"
two-face = { version = "0.4", default-features = false, features = ["syntect-fancy"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"
url = "2"
xai-grok-markdown-core = { path = "../xai-grok-markdown-core" }

[dev-dependencies]
pretty_assertions = "1"
