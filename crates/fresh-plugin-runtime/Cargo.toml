[package]
name = "fresh-plugin-runtime"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "JavaScript plugin runtime for Fresh editor"

[dependencies]
xai-grok-markdown = { path = "../../vendor/xai-grok-markdown" }
anstyle = "1.0"
ratatui = { version = "0.30", default-features = false, features = ["std"] }
rquickjs.workspace = true
rquickjs-serde.workspace = true
serde.workspace = true
serde_json.workspace = true
jsonc-parser.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
fresh-core = { workspace = true, features = ["plugins"] }
fresh-parser-js.workspace = true
fresh-plugin-api-macros.workspace = true
ts-rs.workspace = true
lsp-types.workspace = true
oxc_allocator.workspace = true
oxc_parser.workspace = true
oxc_codegen.workspace = true
oxc_span.workspace = true
oxc_diagnostics.workspace = true

# rquickjs-sys has no pre-generated bindings for FreeBSD
[target.'cfg(target_os = "freebsd")'.dependencies]
rquickjs = { workspace = true, features = ["bindgen"] }

# rquickjs-sys has no pre-generated bindings for NetBSD
[target.'cfg(target_os = "netbsd")'.dependencies]
rquickjs = { workspace = true, features = ["bindgen"] }

[lints]
workspace = true
